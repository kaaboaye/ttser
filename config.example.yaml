# CLI flags override this file. Unspecified values use built-in defaults.
model: ~/.local/share/whisper/ggml-large-v3-turbo.bin
# One entry fixes the language; multiple restrict detection; [] permits all.
languages: [pl, en]
# Optional vocabulary/text context; instructions can bias the transcript.
prompt: ""
# Set a directory to retain audio and results locally, e.g. ~/.local/state/ttser/history.
history_dir: null
# Only changed approvals are saved; null disables correction collection.
# Omit to use $XDG_STATE_HOME/ttser/feedback (or ~/.local/state/ttser/feedback).
feedback_dir: ~/.local/state/ttser/feedback
threads: 4
cpu: false
# Exact name from `ttser devices`; null uses the system default.
input_device: null
# Peak amplitude in the 0..1 range; gain is a linear multiplier, not decibels.
audio_target_peak: 0.25
audio_max_gain: 10.0
max_seconds: 300
# null uses $XDG_RUNTIME_DIR/ttser/control.sock.
socket: null
# Time allowed for the destination to retrieve the clipboard before restoration.
paste_delay_ms: 300
