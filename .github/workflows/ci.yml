name: CI
on: [push, pull_request]

jobs:
  benchmark-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python -m unittest discover -s tests -p test_audio_benchmarks.py
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake libclang-dev libvulkan-dev glslc python3-gi gir1.2-gtk-3.0 xvfb xauth i3-wm xdotool xclip
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo build -p ttser-linux --example review_text --locked
      - run: TTSER_ISOLATED_X11=1 PATH="/usr/bin:$PATH" xvfb-run -a -s "-screen 0 1280x800x24" python3 tests/desktop/review.py
  portable-core:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ttser-core --no-default-features --locked
      - run: cargo check -p ttser --no-default-features --locked
